      support:
        - minimalist-ui
      workflow_node: framing_planning
      handoff_notes:
        - Treat `minimalist-ui` as an optional visual layer; preserve user tasks, accessibility, and platform conventions.
        - Use `design-taste-frontend` only for marketing pages or portfolios; use `web-design-polish` to orchestrate implementation work.

  - id: brutalist_design_direction
