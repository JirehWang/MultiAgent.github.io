precedence:
  - detect_capability_registry_match
  - detect_domain_specialist
  - detect_workflow_mode
  - apply_execution_policy
  - detect_compression_policy
  - detect_review_or_verification_gate
  - detect_finish_or_handoff_step

hard_rules:
  - primary values in route rules are semantic workflow owners; Astra designs the task and chooses the executor, Luna is used only when its eligibility guard passes, and acceptance follows the independent acceptance process
  - choose exactly one primary agent
  - choose zero to two support agents
  - supervisor-agent is advisory support only and never the primary executor or production worker
  - supervisor-agent must not make the final acceptance decision or replace the selected semantic executor; its recommendation cannot override that decision
  - direct low-risk execution may stay with the current model when the direct_execution guards pass and source or behavior evidence is collected
  - explicit delegation, high-risk or ambiguous work, material boundary changes, and stronger domain contracts select delegated_execution or the required specialist path
  - delegated execution applies sol-luna-orchestration, defines Astra acceptance standards, selects a bounded executor, and sends the result to the acceptance process or the qualified domain reviewer for acceptance
  - astra_must_not_execute_delegated_work
  - Astra owns architecture, executor selection, decomposition, and acceptance-standard definition for delegated work; direct work retains current-model responsibility for evidence and completion
  - subagent-driven-development is decomposition/child-dispatch control only; never a production runtime and never owns final acceptance
  - Every SDD child clones the parent dispatch_contract exactly for execution_required, runtime_overlay, and global_contract
  - An SDD child cannot change validation_tier, required_gates, required_artifacts, or acceptance_owner; no local downgrade is allowed
  - Missing or invalid parent or child dispatch_contract is contract-invalid and must escalate
  - Implementers and reviewers return evidence or advisory recommendations only; the acceptance process or the qualified independent reviewer owns final acceptance when review is required
  - Luna is eligible for low-ambiguity, repeatable/batch-like, explicit-output tasks when aggregate workload cost, latency, or throughput benefits materially; preserve selected capability and semantic roles otherwise
  - Use GPT-6.1-Sol for bounded complex coding or agentic execution only after scope and acceptance standards are resolved; do not also assign GPT-6.1-Sol to accept the same packet
  - delegated workers do not recursively route or subdelegate a bounded packet
  - choose exactly one compression policy per routed agent
  - prefer the smallest safe solution that already exists before adding new code, dependencies, or workflow stages
  - for substantive repository source-code build, add, modify, delete, refactor, or code-review work, load the architecture-review skill as a required overlay before implementation or review; preserve the selected semantic primary owner
  - for substantive software-design proposals that could set long-lived module/service ownership, public/shared contracts, data, deployment, or integration boundaries, load architecture-review before finalizing the design even when no code exists; do not route generic planning or documentation-only work through this overlay
  - for an explicit independent software architecture/design review request, load architecture-review even when no code exists; an explicit request triggers at least focused Goldfish review unless the user asks for full depth or impact conditions require it
  - architecture-review always performs lightweight impact and reuse triage for triggered code work; Goldfish runs only for a focused/full grill under the existing impact score and override thresholds or an explicit independent design-review request
  - for a triggered Goldfish review, always run the baseline Zoom Out, Comprehension, and Design Critic lenses; add only the conditional roles matched by nonzero impact dimensions and artifact requirements in the architecture-review role matrix; use fresh-context read-only reviewers, preserve domain reviewer gates, and report NOT_RUN when context isolation is unavailable or subagents are declined
  - Goldfish is a read-only review substage: preserve the selected semantic primary, production executor, and acceptance owner; dispatch only the selected reviewer lenses and do not delegate implementation merely because Goldfish ran
  - Jev architecture scoring is invoked by the architecture-review workflow only after local evidence review yields two or three viable options and project data policy explicitly allows the sanitized summary to leave the environment; missing credentials, blocked network, or invalid response are non-blocking and must never be replaced with invented scores
  - prefer reuse, stdlib, native platform features, and installed dependencies before new abstractions
  - do not remove safety, validation, accessibility, or essential verification just to shrink the change
  - capability registry hits are preferred over broad global-skill search when the specialist fit is clear
  - one shared domain signal alone is not a clear capability match; require an artifact match or at least two independent matching domain signals
  - when a capability is absent, do not select another capability from one overlapping signal; fall back to the normal global skill pool
  - read capability registry and sync policy as UTF-8
  - before capability-related GitHub or cloud sync, run the declared sync gate
  - company capability, company repository, company data, and unknown-context sync require explicit user approval for that specific sync
  - a daily capability does not override company repository or company data context
  - capability registry misses must fall back to the normal global skill pool
  - prefer the narrowest valid domain specialist over a generic workflow skill
  - choose the agent closest to the artifact being produced
  - route multi-stage project governance requests to project-delivery-governor before generic planning or execution skills when the request explicitly spans task control, blocker control, and status promotion
  - decide compression after agent selection, not before it
  - treat headroom as context control and caveman as output-style control
  - do not use review skills before an execution artifact exists
  - do not send tiny obvious tasks through every workflow node
  - do not mistake a proposed abstraction or new subsystem for real task complexity
  - do not treat the capability tree as project codebase scope
  - do not hardcode personal capability domains into the top-level router when the registry can describe them
  - automatically route a request to evaluate, add, install, enable, promote, or connect a tool, CLI, SDK/library, skill, plugin, agent bundle, MCP server, app connector, or extension in the personal-global environment to personal-tool-evaluator before adoption work
  - personal-tool-evaluator is the sole primary for personal-global fit; third-party proposals require skill-gatekeeper as mandatory trust support, while pure trust or security reports remain skill-gatekeeper primary
  - only a YES may continue to a separately requested global action; TRY LOCALLY FIRST is project/local/sandbox only; NO stops global adoption until explicit user override or materially new evidence
  - exclude ordinary usage help, documentation, debugging, and project-local dependency installation unless personal-global promotion is requested
  - third-party skill, MCP, prompt-pack, and agent-bundle installs require skill-gatekeeper trust review before execution, installation, enablement, or promotion
  - security audits must define scope, evidence standard, and safe-testing boundary before execution
  - when trust-boundary overlaps with security-audit, appsec, auth-review, session-review, or exploitability, prefer security-auditor unless the artifact is explicitly workflow design
  - normalize validation tier after route selection; high_risk overrides multi_stage, which overrides standard and basic
  - user preferences for no subagents, a model, delegation, or review are honored within safety and domain limits
  - a high-risk request with an explicit no-subagents preference retains applicable checks and discloses any unavailable independent review
  - stronger domain contracts override global defaults; the known RoHS Luna Low-only/no-alternate execution and independent acceptance contract is preserved without reading excluded sources
  - evidence may be reused only when artifact, environment/dependencies, and verification scope are unchanged and the prior result is complete and applicable

workflow_nodes:
  - id: intent_router
    purpose: classify the request before meaningful work
    allowed_agents:
      - using-superpowers
    outputs:
      - fast_track
      - full_workflow
      - likely_domain
      - validation_tier
      - required_gates
      - required_artifacts
      - validation_contract
      - next_node
  - id: domain_classification
    purpose: decide whether the task belongs to a specialist domain
    allowed_agents:
      - email-intelligence-engineer
      - prompt-engineer
      - multi-agent-systems-architect
      - context-scout
      - oss-solution-scout
      - personal-tool-evaluator
      - skill-gatekeeper
      - security-auditor
      - design-taste-frontend
      - redesign-existing-projects
      - web-design-polish
      - visual-qa
      - image-to-code
      - ui-ux-pro-max
  - id: framing_planning
    purpose: prepare the work contract before execution
    allowed_agents:
      - brainstorming
      - writing-plans
      - multi-agent-systems-architect
      - writing-skills
      - security-auditor
      - security-scan-contract
      - design-taste-frontend
      - ui-ux-pro-max
      - web-design-polish
      - email-intelligence-engineer
      - prompt-engineer
      - validation-standards
      - personal-tool-evaluator
      - skill-gatekeeper
  - id: decomposition_dispatch
    purpose: split work when single-agent execution is not enough
    allowed_agents:
      - sol-luna-orchestration
      - dispatching-parallel-agents
      - subagent-driven-development
      - multi-agent-systems-architect
  - id: execution
    purpose: perform the main work
    allowed_agents:
      - sol-luna-orchestration
      - executing-plans
      - test-driven-development
      - systematic-debugging
      - writing-skills
      - doc-ops
      - email-intelligence-engineer
      - prompt-engineer
      - multi-agent-systems-architect
      - context-scout
      - oss-solution-scout
      - skill-gatekeeper
      - api-contract-governance
      - security-auditor
      - design-taste-frontend
      - redesign-existing-projects
      - web-design-polish
      - visual-qa
      - image-to-code
      - ui-ux-pro-max
  - id: review
    purpose: inspect implementation or process review feedback
    allowed_agents:
      - requesting-code-review
      - receiving-code-review
      - writing-skills
  - id: verification
    purpose: prove that work is actually done
    allowed_agents:
      - verification-before-completion
      - api-contract-governance
      - visual-qa
  - id: finish_integration
    purpose: merge, handoff, or clean up
    allowed_agents:
      - finishing-a-development-branch
      - using-git-worktrees
      - writing-skills

route_rules:
  - id: third_party_personal_global_intake
    match:
      all_domain_signals:
        - personal-global-adoption
        - third-party-intake
      artifact_type:
        - personal-global-adoption
        - global-install-decision
        - global-enable-decision
        - global-promotion-decision
        - global-connection-decision
        - install-decision
    select:
      primary: personal-tool-evaluator
      support:
        - skill-gatekeeper
      workflow_node: domain_classification
      gate_decision: pending
      handoff_notes:
        - Keep personal-tool-evaluator as the only primary for personal-global fit and value.
        - Require skill-gatekeeper trust output before any third-party global install, enable, promotion, or connection.
        - YES may continue only to a separately requested global action; TRY LOCALLY FIRST is local/project/sandbox only; NO stops global adoption until explicit user override or materially new evidence.

  - id: general_personal_global_intake
    match:
      any_domain_signals:
        - personal-global-adoption
        - global-install
        - global-enable
        - global-promotion
        - global-connection
      artifact_type:
        - personal-global-adoption
        - global-install-decision
        - global-enable-decision
        - global-promotion-decision
        - global-connection-decision
        - install-decision
    select:
      primary: personal-tool-evaluator
      support: []
      workflow_node: domain_classification
      gate_decision: pending
      handoff_notes:
        - Evaluate personal-global fit before any adoption work; do not require an explicit skill invocation.
        - YES may continue only to a separately requested global action; TRY LOCALLY FIRST is local/project/sandbox only; NO stops global adoption until explicit user override or materially new evidence.
        - Exclude ordinary usage help, documentation, debugging, and project-local dependency installation unless personal-global promotion is requested.

  - id: presentation_layout_reasoning
    match:
      any_domain_signals:
        - ppt
        - pptx
        - powerpoint
        - presentation
        - slide-deck
        - slide-layout
        - slide-design
        - presentation-layout
        - presentation-design
        - ppt-layout
        - native-shape
        - diagram-layout
        - slide-review
      artifact_type:
        - presentation
        - slide-deck
        - pptx
        - ppt-layout
        - presentation-design
        - slide-review
    select:
      primary: doc-ops
      support: []
      workflow_node: execution
      required_skill_overlays: [ppt-layout-reasoning]
      handoff_notes:
        - Load `ppt-layout-reasoning` before slide planning or editing.
        - Keep `doc-ops` as the primary document/presentation execution owner and use native presentation tooling.

  - id: extension_intake_review
    match:
      any_domain_signals:
        - skill-intake
        - third-party-skill
        - skill-install
        - mcp-intake
        - mcp-server
        - prompt-pack
        - extension-permissions
        - supply-chain-risk
        - install-trust
      artifact_type:
        - risk-assessment
        - install-decision
        - skill-review
        - mcp-review
    select:
      primary: skill-gatekeeper
      support: []
      workflow_node: domain_classification
      gate_decision: pending
      handoff_notes:
        - This route is primary for pure trust or security review and non-global extension intake; the preceding personal-global routes own personal-global fit.
        - This route is a mandatory trust gate before any third-party install, enable, or promotion step.
        - Produce an explicit decision: allow, manual-review, or block.
        - Record source, version or commit, key risks, and rationale with the decision.

  - id: security_audit_review
    match:
      any_domain_signals:
        - security-audit
        - vuln-assessment
        - exploitability
        - auth-review
        - session-review
        - secrets-exposure
        - trust-boundary
        - appsec
      artifact_type:
        - security-report
        - vulnerability-report
        - risk-assessment
        - audit-findings
    select:
      primary: security-auditor
      support:
        - security-scan-contract
      workflow_node: framing_planning
      security_scope: required
      evidence_standard: required
      safe_testing_boundary: required
      handoff_notes:
        - Stage 1 must define audit scope, evidence standard, and safe-testing limits before findings work.
        - Stage 2 may perform execution only after those constraints are stated.
        - Prioritize confirmed or well-supported vulnerabilities over speculative issues.

  - id: minimalist_design_direction
    match:
      any_domain_signals:
        - minimalist
        - editorial-ui
        - restrained-ui
      artifact_type:
