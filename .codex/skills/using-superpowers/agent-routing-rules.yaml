version: 1
date: 2026-09-09

purpose:
  - classify requests into a LangGraph-style workflow
  - check the specialized capability registry before broad global-skill fallback
  - automatically apply architecture and reuse triage to substantive repository code changes
  - apply a global anti-overengineering decision ladder before adding structure
  - choose one primary agent
  - optionally choose up to two support agents
  - decide one compression policy for the routed agent
  - decide the next workflow node

# Canonical model and reasoning-effort policy. Entry points summarize this block.
model_effort_policy:
  supported_efforts: [low, medium, high, max]
  explicit_user_choice: wins_when_supported_and_within_safety_or_domain_contract
  unsupported_explicit_choice:
    outcome: reject_and_report
    preserve_requested_values_in_diagnostics: true
    never_silent_default_or_substitute: true
  missing_choice: use_role_default
  controller:
    role: astra
    model: gpt-6-astra
    supported_models: [gpt-6-astra]
    default_effort: medium
    low_when: trivial_routing_or_status
    high_when: complex_architecture_or_evaluation
    max_when: material_high_risk_or_repeated_unresolved_reasoning_failure
  executor:
    role: luna
    model: gpt-6-luna
    supported_models: [gpt-6-luna]
    default_effort: medium
    low_when: mechanical_edit_with_explicit_output
    high_when: bounded_cross_file_implementation_or_test_repair
    max_when: bounded_difficult_retry_while_luna_eligible
  complex_executor:
    role: sol_complex_execution
    model: gpt-6.1-sol
    supported_models: [gpt-6.1-sol]
    default_effort: medium
    high_when: bounded_complex_coding_or_agentic_workflow
    max_when: bounded_difficult_retry_with_resolved_acceptance_standards
  acceptance:
    role: acceptance_process
    model: gpt-6.1-sol
    supported_models: [gpt-6.1-sol]
    default_effort: high
    low_when: formatting_or_completeness_only
    medium_when: narrow_low_risk_acceptance
    max_when: high_consequence_security_or_compliance_or_conflicting_evidence
    low_never_substitutes_for_substantive_independent_acceptance: true
  packet_rule: record_selected_model_effort_and_short_reason; never_silently_lower_active_packet

agent_profile_policy:
  semantic_profiles_define: [role, instructions, constraints]
  runtime_model_source: model_effort_policy_and_dispatch_contract
  per_agent_model_pin: prohibited
  per_agent_reasoning_effort_pin: prohibited

execution_policy:
  owner: using-superpowers
  detailed_policy_source: this_file
  controller:
    direct: current_model
    delegated: astra
    evaluation: astra
    model: gpt-6-astra
    reasoning_effort: medium
  compatibility_role_aliases:
    root_sol: astra
    sol_control_plane: astra_control_plane
  acceptance_owner:
    direct: current_model
    delegated: acceptance_process_or_qualified_independent_reviewer
  delegated_overlay: sol-luna-orchestration
  apply_after_semantic_route_selection: true
  classification:
    execution_required_false_only_for:
      - clarification
      - routing
      - decomposition
      - approval-or-rejection
      - verification-judgment
      - status-reporting
    execution_required_true_for:
      - substantive-answer-or-decision-input
      - artifact-production
      - code-or-file-change
      - research-or-analysis
      - test-or-build
      - extraction
      - external-tool-operation
  jev_optional_preflight:
    owner: workflow-router
    adapter_env: CODEX_JEV_ROUTER_PATH
    optional: true
    skip_when_unset: true
    mode: global_fail_open
    trigger_when_all:
      - substantive_request_needs_routing
      - typesafe_api_key_available
    max_calls_per_request: 1
    input_contract:
      - one_line_routing_synopsis_only
      - include_task_shape_requested_outcome_and_relevant_risk_signals
      - exclude_source_code_attachments_credentials_and_full_conversation
      - never_place_api_key_in_command_line_or_routing_payload
    decision_handling:
      auto_route: advisory_signal_for_native_router_and_astra
      human_review: preserve_review_gate
      fallback_or_error: continue_native_routing_without_retry
    authority:
      - explicit_user_instructions_remain_authoritative
      - safety_and_domain_contracts_remain_authoritative
      - native_validation_tier_and_gates_remain_authoritative
      - astra_retains_final_route_authority
      - jev_never_executes_or_dispatches_agents
  astra_control_plane:
    applies_when:
      - delegated_execution_requested
      - delegated_execution_required_by_risk_or_domain
    responsibilities:
      - understand_request
      - design_task_architecture
      - select_execution_target
      - decompose_ownership
      - define_acceptance_standards
    prohibited:
      - production_execution
      - evidence_interpretation
      - pass_fail_decision
  luna_execution:
    lane: internal_luna
    runtime_agent_type: worker
    runtime_model: gpt-6-luna
    runtime_reasoning_effort: medium
    eligibility_all_required:
      - bounded_scope
      - explicit_output
      - low_ambiguity
      - repeatable_or_batch_like
      - material_aggregate_workload_benefit
    benefit_policy:
      evaluate_across_entire_batch: true
      benefit_sources: [aggregate_token_demand, repeated_volume, latency_or_throughput]
      exclude_when_dispatch_overhead_exceeds_expected_gain: true
  sol_complex_execution:
    lane: internal_sol_complex_executor
    runtime_agent_type: worker
    runtime_model: gpt-6.1-sol
    runtime_reasoning_effort: medium
    eligibility_all_required:
      - bounded_scope
      - explicit_output
      - complex_coding_or_agentic_workflow
      - architecture_and_acceptance_standards_resolved
      - luna_not_fit_or_not_preferred
      - gpt_6_1_sol_not_assigned_as_acceptance_runtime_for_same_packet
    acceptance_guard:
      if_independent_review_required: qualified_domain_reviewer_distinct_from_gpt_6_1_sol
  acceptance_process:
    lane: internal_acceptance_process
    runtime_agent_type: worker
    runtime_model: gpt-6.1-sol
    runtime_reasoning_effort: high
    applies:
      - delegated_execution
      - independent_review_required
  visible_task_runtime:
    lane: visible_luna_task
    authorization: explicit-current-user-request
    runtime_model: gpt-6-luna
    runtime_reasoning_effort: medium
  direct_execution:
    allowed_when_all:
      - request_and_artifact_are_clear
      - low_risk
      - bounded_scope
      - no_material_cross_boundary
      - no_explicit_delegation_or_review_request
      - no_stronger_domain_contract
    required_evidence:
      - inspect_relevant_source_or_inputs
      - verify_relevant_behavior_or_output
      - tie_evidence_to_current_artifact_or_answer
    independent_review: not_required_by_default
  delegated_execution:
    trigger_when_any:
      - explicit_user_delegation_or_model_request
      - explicit_independent_review_request
      - high_risk_or_high_consequence
      - material_cross_boundary_change
      - unresolved_ambiguity_or_ownership
      - stronger_domain_contract_requires_specialist_or_runtime
    runtime_overlay: sol-luna-orchestration
    controller: astra
    worker_selection:
      order:
        - sol_complex_when_all
        - luna_when_all
        - selected_semantic_executor
      sol_complex_when_all:
        - bounded_scope
        - explicit_output
        - complex_coding_or_agentic_workflow
        - architecture_and_acceptance_standards_resolved
        - luna_not_fit_or_not_preferred
        - gpt_6_1_sol_not_assigned_as_acceptance_runtime_for_same_packet
      luna_when_all:
        - bounded_scope
        - explicit_output
        - low_ambiguity
        - repeatable_or_batch_like
        - material_aggregate_workload_benefit
      otherwise: selected_semantic_executor
    independent_review:
      required_when_any:
        - high_risk_or_high_consequence
        - explicit_independent_review_request
        - stronger_domain_contract_requires_review
      owner: acceptance_process_or_qualified_domain_reviewer
    no_recursive_routing: true
  user_precedence:
    order:
      - explicit_no_subagents_or_direct_execution
      - explicit_model_request
      - explicit_delegation_or_review_request
      - stronger_domain_contract
      - risk_and_scope_gates
    limits:
      - user_preferences_do_not_waive_safety_or_domain_gates
      - no_subagents_on_high_risk_keeps_applicable_checks_and_discloses_unavailable_independent_review
  evidence_policy:
    completion_requires:
      - inspected_current_artifact_or_answer
      - artifact_version_or_digest
      - environment_and_dependency_fingerprint
      - verification_scope
      - complete_applicable_result
    reuse_only_when_unchanged:
      - artifact_version_or_digest
      - environment_and_dependency_fingerprint
      - verification_scope
      - result_complete_and_applicable
    rerun_when_any:
      - artifact_changed
      - environment_or_dependency_changed
      - verification_scope_changed
      - prior_evidence_failed_or_incomplete
      - new_symptom_or_missing_original_check
    handoff_or_message_boundary_alone_does_not_invalidate: true
  domain_contract_precedence:
    principle: stronger_domain_contract_overrides_global_defaults
    rules:
      - global_simplification_must_not_weaken_specialist_or_domain_constraints
      - explicit_domain_runtime_and_acceptance_constraints_remain_in_force
      - previously_known_rohs_contract_is_luna_low_only_no_alternate_and_acceptance_process
      - excluded_domain_sources_are_not_read_or_validated_by_this_stack_test
  scaling:
    small_execution_workers: 1
    normal_execution_workers: 1
    independent_execution_workers: 2-3
    read_only_parallel_max: 4
    shared_file_or_dependency_policy: serial
  hard_rules:
    - astra_must_not_execute_delegated_work
    - astra_must_define_acceptance_standards_before_delegated_execution
    - acceptance_process_must_apply_standards_before_delegated_acceptance
    - luna_must_not_self_accept
    - luna_is_not_universal_execution_runtime
    - gpt_6_1_sol_must_not_execute_a_packet_that_uses_gpt_6_1_sol_for_independent_acceptance
    - gpt_6_1_sol_complex_execution_is_limited_to_bounded_resolved_engineering_packets
    - gpt_6_1_sol_is_not_the_fallback_for_every_luna_ineligible_task
    - direct_execution_is_allowed_only_when_all_direct_execution_guards_pass
    - delegated_workers_do_not_restart_routing_or_subdelegate_without_authorization
    - explicit_user_preferences_win_within_safety_and_domain_limits
    - evidence_reuse_requires_unchanged_artifact_environment_dependencies_and_scope
    - preserve_semantic_primary_and_support_roles_when_luna_is_not_eligible
    - astra_must_not_rescue_failed_worker_implementation
    - supervisor-agent is advisory QA support only; it is not a primary executor, production worker, or final acceptance decision owner
    - supervisor-agent must inherit the parent Astra dispatch_contract and escalate contract-invalid when it is missing or invalid
    - subagent-driven-development is decomposition/child-dispatch control only; never a production runtime and never owns final acceptance
    - Every SDD child clones the parent dispatch_contract exactly for execution_required, runtime_overlay, and global_contract
    - An SDD child cannot change validation_tier, required_gates, required_artifacts, or acceptance_owner; no local downgrade is allowed
    - Missing or invalid parent or child dispatch_contract is contract-invalid and must escalate
    - Implementers and reviewers return evidence or advisory recommendations only; the acceptance process alone owns final pass, retry, and rollback

validation_policy:
  principle: risk-proportional-validation
  purpose: keep development controlled without forcing every task through the full SDD-DDD-BDD-TDD chain
  tiers:
    basic:
      applies_to:
        - simple-question
        - documentation
        - mechanical-edit
      required_gates:
        - basic_correctness_check
      required_artifacts:
        - result_or_answer
      forbidden_shortcuts:
        - none
    standard:
      applies_to:
        - single-module-feature
        - single-module-bugfix
        - behavior-change-with-narrow-surface
      required_gates:
        - lightweight_sdd
        - tdd_or_strongest_practical_test
        - completion_verification
      required_artifacts:
        - requirement_or_acceptance_criteria
        - focused_test_or_regression_check
        - verification_evidence
      notes:
        - lightweight_sdd may be one short acceptance checklist; do not create a separate document when the task context already carries it.
        - If TDD is impractical, record the reason and use the next strongest verification.
    multi_stage:
      applies_to:
        - multi-module-change
        - api-change
        - database-or-schema-change
        - user-journey-change
        - cross-service-integration
      required_gates:
        - sdd
        - applicable_ddd
        - applicable_bdd
        - tdd
        - integration_or_e2e_verification
        - completion_verification
      required_artifacts:
        - scope_constraints_and_acceptance_criteria
        - domain_model_or_explicit_ddd_exemption
        - behavior_scenarios_or_explicit_bdd_exemption
        - executable_tests
        - integration_or_e2e_evidence
        - verification_evidence
      notes:
        - DDD is required when domain rules, invariants, bounded contexts, or ownership boundaries are material.
        - BDD is required when externally observable behavior, user journeys, or service contracts are material.
        - A single living artifact may satisfy multiple documentation outputs when traceability is preserved.
    high_risk:
      applies_to:
        - payment
        - authorization
        - regulated-data
        - compliance
        - security-sensitive-change
        - high-consequence-change
      required_gates:
        - sdd
        - ddd
        - bdd
        - tdd
        - review
        - security_or_domain_gate
        - integration_or_e2e_verification
        - completion_verification
      required_artifacts:
        - approved_scope_and_acceptance_criteria
        - domain_model_and_invariants
        - behavior_scenarios
        - executable_tests
        - independent_review_evidence
        - security_or_domain_gate_evidence
        - verification_evidence
      notes:
        - Do not promote status or claim completion when a required gate lacks evidence.
  escalation:
    - from: basic
      when_any:
        - code-change
        - behavior-change
      to: standard
    - from: standard
      when_any:
        - multiple-subsystems
        - api-boundary
        - persistence-boundary
        - user-journey
        - cross-service
        - unresolved-domain-rule
      to: multi_stage
    - from: multi_stage
      when_any:
        - payment
        - authorization
        - regulated-data
        - compliance
        - security-sensitive-change
        - high-consequence-change
      to: high_risk
  control_rules:
    - assign validation_tier before substantive execution
    - choose the lowest tier that covers all observed risk signals
    - never skip a required gate silently; record the gap, remaining risk, and escalation owner
    - do not use passing tests alone as proof that requirements are satisfied
    - allow feedback from BDD, integration, or E2E verification to reopen SDD or DDD

validation_tier_normalization:
  apply_after_route_selection: true
  precedence:
    - high_risk
    - multi_stage
    - standard
    - basic
  preserve:
    - chosen_primary_agent
    - chosen_support_agents
    - workflow_node
  overrides:
    high_risk:
      when_any:
        - payment
        - authorization
        - regulated-data
        - compliance
        - security-sensitive-change
        - high-consequence-change
      required_gates_from: validation_policy.tiers.high_risk.required_gates
      required_artifacts_from: validation_policy.tiers.high_risk.required_artifacts
    multi_stage:
      when_any:
        - multiple-subsystems
        - api-boundary
        - api-change
        - persistence-boundary
        - database-or-schema-change
        - user-journey
        - user-journey-change
        - cross-service
        - cross-service-integration
        - unresolved-domain-rule
      required_gates_from: validation_policy.tiers.multi_stage.required_gates
      required_artifacts_from: validation_policy.tiers.multi_stage.required_artifacts
    standard:
      when_any:
        - code-change
        - behavior-change
        - single-module-feature
        - single-module-bugfix
      required_gates_from: validation_policy.tiers.standard.required_gates
      required_artifacts_from: validation_policy.tiers.standard.required_artifacts
    basic:
      when_any:
        - simple-question
        - documentation
        - mechanical-edit
      required_gates_from: validation_policy.tiers.basic.required_gates
      required_artifacts_from: validation_policy.tiers.basic.required_artifacts
  merge_rules:
    - higher-risk tiers override lower-risk route defaults
    - required gates and artifacts come from the normalized tier
    - normalization must not replace the selected workflow owner
    - a normalized tier may not be silently downgraded later

stage_contracts:
  adapter: validation-standards
  principle: use-open-standards-without-unreviewed-extension-installation
  sdd:
    reference: github/spec-kit-core
    artifacts:
      - specification
      - plan
      - tasks
      - acceptance-checklist
    pass_criteria:
      - every-in-scope-requirement-has-observable-acceptance
      - scope-and-non-goals-are-explicit
      - no-critical-unresolved-ambiguity
    failure_action: return-to-requirements-and-record-remaining-risk
  ddd:
    reference:
      - ContextMapper/context-mapper-dsl
      - TNG/ArchUnit-or-ArchUnitNET
    applies_when:
      - domain-rules-are-material
      - invariants-are-material
      - ownership-or-bounded-contexts-are-material
      - service-decomposition-or-contracts-are-material
    artifacts:
      - ubiquitous-language
      - bounded-contexts-and-ownership
      - invariants-and-aggregate-boundaries
      - integration-contracts
    executable_boundary_check: use-project-native-architecture-tests-when-available
    pass_criteria:
      - each-material-domain-rule-has-owner-and-enforcement-point
      - context-boundaries-and-cross-context-contracts-are-explicit
      - structural-architecture-checks-do-not-stand-in-for-business-correctness
    failure_action: return-to-sdd-or-ddd-and-record-contradiction
  bdd:
    reference:
      - cucumber/gherkin
      - cucumber-bdd-practices
    applies_when:
      - externally-observable-behavior-is-material
      - user-journey-is-material
      - service-contract-is-material
    artifacts:
      - gherkin-compatible-scenarios
      - scenario-to-acceptance-trace
    runner_policy: use-project-native-runner; do-not-force-cucumber-stack
    pass_criteria:
      - critical-acceptance-criteria-map-to-observable-scenarios
      - relevant-happy-negative-edge-and-failure-paths-are-covered
      - scenarios-are-executable-or-have-explicit-review-evidence
    failure_action: return-to-sdd-or-ddd-and-record-contradiction

supply_chain_policy:
  decision: allow-core-only-with-standard-oss-notices
  approved_references:
    sdd:
      - github/spec-kit-core
      - Fission-AI/OpenSpec-core
    ddd:
      - ContextMapper/context-mapper-dsl
      - TNG/ArchUnit
      - TNG/ArchUnitNET
    bdd:
      - cucumber/gherkin
      - project-native-cucumber-compatible-runner
  mandatory_controls:
    - pin-version-or-commit
    - no-latest
    - preserve-license-and-notice-files
    - review-transitive-dependencies-and-sbom
    - disable-openspec-telemetry-before-use
    - review-spec-kit-shell-workflows-before-execution
    - run-skill-gatekeeper-before-third-party-skill-or-extension-intake
  prohibited_by_default:
    - unreviewed-community-extension
    - unreviewed-community-preset
    - unreviewed-community-workflow
    - unreviewed-community-schema
    - unreviewed-third-party-skill

capability_registry:
  semantics:
    - preferred-index
    - not-exclusive
    - not-codebase
  source: environment-installed capability registry
  dispatch_contract:
    required_read: SPECIALIZED_CAPABILITY_DISCOVERY.md
    supported_modes:
      - direct-skill
      - delegate-router
    rules:
      - use capability registry as an overlay, not as a replacement for the global skill pool
      - if dispatch mode is direct-skill, route to the declared primary owner
      - if dispatch mode is delegate-router, route to the declared primary owner and carry the capability-local router reference forward
      - do not mirror capability-local routing internals into this top-level file

