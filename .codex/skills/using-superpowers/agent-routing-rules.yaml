        - plan
        - execution-plan
    select:
      primary: writing-plans
      support: []
      workflow_node: framing_planning

  - id: execute_existing_plan
    match:
      any_domain_signals:
        - execute-plan
      artifact_type:
        - implementation
        - execution
    select:
      primary: executing-plans
      support: []
      workflow_node: execution
      required_skill_overlays:
        - architecture-review

  - id: api_contract_review
    match:
      any_domain_signals:
        - api-contract
        - endpoint-drift
        - cross-platform-api
        - architecture-conformance
        - contract-compatibility
      artifact_type:
        - api-contract
        - architecture
        - architecture-review
        - integration-review
        - repo-map
        - investigation
    select:
      primary: api-contract-governance
      support: []
      workflow_node: verification
      handoff_notes:
        - Compare the observed code graph with explicit intended architecture and API contracts; a graph alone cannot establish conformance.
        - Prefer the already-enabled codebase_memory MCP, verify index coverage, and fall back to source inspection when unavailable.
        - Return PASS, FAIL, or UNKNOWN with file/symbol evidence and coverage limitations.

  - id: api_contract_change
    match:
      any_domain_signals:
        - api-change
        - api-contract
        - endpoint-drift
        - cross-platform-api
        - integration-contract
      artifact_type:
        - code
        - implementation
    select:
      primary: test-driven-development
      support:
        - api-contract-governance
      workflow_node: execution
      validation_tier: multi_stage
      required_skill_overlays:
        - architecture-review
      handoff_notes:
        - Load architecture-review before implementation; keep test-driven-development as the primary execution owner and api-contract-governance as the API boundary support.
        - Keep the implementation owner responsible for the code change; api-contract-governance maps consumers/providers and verifies the affected contracts and architecture edges.
        - Use the project's existing lint, compatibility, architecture, and integration checks; do not install new tools.

  - id: bugfix
    match:
      flags:
        needs_debugging: true
      any_domain_signals:
        - bug
        - failing-test
        - regression
        - unexplained-behavior
    select:
      primary: systematic-debugging
      support: []
      workflow_node: execution
      validation_tier: standard
      required_skill_overlays:
        - architecture-review
      required_gates:
        - lightweight_sdd
        - tdd_or_strongest_practical_test
        - completion_verification
      handoff_notes:
        - Preserve the original symptom as a regression check.
        - If the change crosses a subsystem, API, persistence, or user-journey boundary, escalate to multi_stage before implementation.

  - id: behavior_change
    match:
      any_domain_signals:
        - feature
        - behavior-change
        - implementation
      artifact_type:
        - code
        - implementation
    select:
      primary: test-driven-development
      support: []
      workflow_node: execution
      validation_tier: standard
      required_skill_overlays:
        - architecture-review
      required_gates:
        - lightweight_sdd
        - tdd_or_strongest_practical_test
        - completion_verification
      handoff_notes:
        - Load the architecture-review overlay before code changes; perform evidence-based impact and reuse triage, and grill only when its escalation criteria are met.
        - If multiple subsystems, API, database, user-journey, or cross-service signals are present, escalate to multi_stage.
        - If payment, authorization, compliance, regulated-data, security-sensitive, or high-consequence signals are present, escalate to high_risk.

  - id: validation_standards
    match:
      any_domain_signals:
        - sdd-validation
        - ddd-validation
        - bdd-validation
        - validation-standard
        - supply-chain-policy
      artifact_type:
        - validation-contract
        - workflow
        - architecture
        - routing-plan
    select:
      primary: validation-standards
      support:
        - skill-gatekeeper
      workflow_node: framing_planning
      validation_tier: multi_stage
      required_gates:
        - sdd
        - applicable_ddd
        - applicable_bdd
        - supply_chain_review
        - completion_verification
      handoff_notes:
        - Keep the adapter tool-neutral and do not install external extensions automatically.
        - Escalate to high_risk when the policy itself governs payment, authorization, compliance, or security-sensitive changes.

  - id: request_review
    match:
      flags:
        needs_review: true
      any_domain_signals:
        - review-request
      artifact_type:
        - code
        - diff
        - review-request
    select:
      primary: requesting-code-review
      support: []
      workflow_node: review
      required_skill_overlays:
        - architecture-review
      handoff_notes:
        - For repository code diffs, load architecture-review to check the frozen design/reuse criteria while keeping requesting-code-review as the review owner.

  - id: process_review_feedback
    match:
      any_domain_signals:
        - review-feedback
        - review-comments
      artifact_type:
        - code
        - review-response
    select:
      primary: receiving-code-review
      support: []
      workflow_node: review

  - id: verify_completion
    match:
      any_domain_signals:
        - verify
        - completion
      artifact_type:
        - completed-work
        - release-ready
    select:
      primary: verification-before-completion
      support: []
      workflow_node: verification

defaults:
  control_only_request:
    primary: using-superpowers
    support: []
    execution_required: false
    acceptance_owner: astra
    workflow_node: intent_router
  tiny_obvious_question:
    primary: using-superpowers
    support: []
    execution_required: true
    execution_lane: direct
    runtime_agent_type: current_model
    runtime_model: current_model
    runtime_reasoning_effort: inherited
    acceptance_owner: current_model
    independent_review_required: false
    luna_eligible: false
    luna_ineligibility_reason: tiny-or-no-aggregate-workload-benefit
    compression_policy:
      profile: user-facing
      headroom: off
      caveman: off
      reasons:
        - tiny-task
        - context-light
    workflow_node: intent_router
  direct_low_risk_work:
    primary: selected_semantic_agent
    support: []
    execution_required: true
    execution_lane: direct
    runtime_agent_type: current_model
    runtime_model: current_model
    runtime_reasoning_effort: inherited
    acceptance_owner: current_model
    independent_review_required: false
    workflow_node: execution
  delegated_or_reviewed_work:
    primary: selected_semantic_agent
    support: []
    execution_required: true
    execution_lane: delegated
    runtime_agent_type: selected_semantic_agent_or_luna
    runtime_model: inherited_or_sol_complex_or_luna_when_eligible
    runtime_reasoning_effort: inherited_or_selected_effort
    acceptance_owner: acceptance_process_or_qualified_independent_reviewer
    independent_review_required: true
    workflow_node: execution
  unclear_repo_task:
    primary: context-scout
    support: []
    compression_policy:
      profile: tool-heavy-worker
      headroom: on
      caveman: lite
      reasons:
        - repo-onboarding
        - investigation
        - summary-friendly
    workflow_node: domain_classification
  ambiguous_multi_step_task:
    primary: writing-plans
    support: []
    compression_policy:
      profile: planner
      headroom: on
      caveman: full
      reasons:
        - planning
        - multi-step
        - handoff-friendly
    workflow_node: framing_planning

compression_policy_defaults:
  profiles:
    user-facing:
      headroom: on
      caveman: off
      use_when:
        - final-user-output
        - explanation-heavy
    planner:
      headroom: on
      caveman: full
      use_when:
        - planning
        - dispatch
        - handoff-setup
    router:
      headroom: on
      caveman: full
      use_when:
        - routing
        - classification
        - next-step-selection
    worker:
      headroom: on
      caveman: off
      use_when:
        - codegen
        - spec-writing
        - deep-debugging
        - artifact-production
    tool-heavy-worker:
      headroom: on
      caveman: lite
      use_when:
        - tool-heavy
        - mcp-heavy
        - doc-heavy
        - log-triage
    reviewer:
      headroom: on
      caveman: lite
      use_when:
        - review-summary
        - concise-findings
    verifier:
      headroom: on
      caveman: lite
      use_when:
        - verification-summary
        - evidence-summary
  signal_rules:
    headroom_on_when_any:
      - mcp-heavy
      - tool-heavy
      - doc-heavy
      - long-session
      - rag-heavy
      - multi-step
    caveman_full_when_any:
      - routing
      - planning
      - dispatch
    caveman_lite_when_any:
      - triage-summary
      - review-summary
      - verification-summary
    caveman_off_when_any:
      - final-user-output
      - codegen
      - spec-writing
      - pr-writing
      - deep-debugging

conflict_resolution:
  order:
    - prefer_security_auditor_when_security_signals_overlap
    - choose_agent_closest_to_artifact
    - choose_narrowest_valid_domain
    - demote_others_to_support_agents
  security_overlap_priority:
    when_any_domain_signals:
      - security-audit
      - vuln-assessment
      - exploitability
      - auth-review
      - session-review
      - appsec
    and_any_domain_signals:
      - trust-boundary
    prefer_primary: security-auditor
    unless_artifact_type:
      - workflow
      - architecture
  examples:
    - request: Write a prompt to extract action items from emails
      primary: prompt-engineer
      support:
        - email-intelligence-engineer
    - request: Turn a mailbox export into structured tasks
      primary: email-intelligence-engineer
      support: []
    - request: Design a workflow where one agent parses emails and another scores urgency
      primary: multi-agent-systems-architect
      support:
        - email-intelligence-engineer
        - prompt-engineer
    - request: Redesign this landing page with a minimalist editorial feel
      primary: design-taste-frontend
      support:
        - ui-ux-pro-max
    - request: Produce a brand kit board for a new fintech product
      primary: ui-ux-pro-max
      support:
        - writing-skills
    - request: Review this third-party MCP server before I install it
      primary: skill-gatekeeper
      support: []
    - request: Audit this repository for exploitable auth and session issues
      primary: security-auditor
      support: []
